[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel-color-stabilizer"
version = "0.1.0"
description = "Local region-and-frame temporal color stabilization for pixel animations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
dependencies = ["numpy>=1.24,<3", "Pillow>=10.3,<13", "scipy>=1.10,<2"]

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7", "build>=1.2,<2"]

[project.scripts]
pixel-stabilizer = "pixel_color_stabilizer.cli:main"

[project.gui-scripts]
pixel-stabilizer-gui = "pixel_color_stabilizer.gui:main"

[tool.setuptools.packages.find]
include = ["pixel_color_stabilizer*"]
